name: build v2rayN.Web

on:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Official upstream release tag (for example 7.25.3). Empty builds a dev identity without release assets.'
        required: false
        default: ''
        type: string
  pull_request:
    branches:
      - master
    paths:
      - '.dockerignore'
      - 'v2rayN/v2rayN.Web/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/upload-sign.yml'
  push:
    branches:
      - web
    paths:
      - '.dockerignore'
      - 'v2rayN/v2rayN.Web/**'
      - 'v2rayN/ServiceLib/**'
      - 'v2rayN/ServiceLib.Tests/**'
      - 'v2rayN/Directory.Build.*'
      - 'v2rayN/Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/upload-sign.yml'

permissions:
  contents: read

jobs:
  identity:
    name: Resolve Web build identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
      build_date: ${{ steps.resolve.outputs.build_date }}
    steps:
      - name: Resolve version from the official release tag
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ -z "${RELEASE_TAG}" ]]; then
            {
              echo "version=0.0.0-dev"
              echo "tag="
              echo "release=false"
              echo "build_date=$build_date"
            } >> "$GITHUB_OUTPUT"
          else
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid official release tag: $RELEASE_TAG" >&2
              exit 1
            }
            {
              echo "version=$RELEASE_TAG"
              echo "tag=$RELEASE_TAG"
              echo "release=true"
              echo "build_date=$build_date"
            } >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify Web and tests
    runs-on: ubuntu-24.04
    env:
      TUNIT_MAX_PARALLEL_TESTS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Verify frontend, tests, native publish, and packaging dry-run
        run: bash v2rayN/v2rayN.Web/Scripts/verify.sh "$RUNNER_TEMP/v2rayN.Web-verify"

      - name: Check patch whitespace
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree -w /dev/null)"
            git diff --check "$empty_tree" HEAD
          else
            git diff --check "$BASE_SHA...HEAD"
          fi

  native:
    name: Native artifact (${{ matrix.rid }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      RID: ${{ matrix.rid }}
      V2RAYN_WEB_VERSION: ${{ needs.identity.outputs.version }}
      V2RAYN_WEB_REPOSITORY: ${{ github.repository }}
      V2RAYN_WEB_COMMIT: ${{ github.sha }}
      V2RAYN_WEB_BUILD_DATE: ${{ needs.identity.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Publish native Web app
        run: bash v2rayN/v2rayN.Web/Scripts/publish-native.sh "$RID"

      - name: Integrate original Linux Core bundle
        run: sh v2rayN/v2rayN.Web/Scripts/fetch-core-bundle.sh "$RID" "v2rayN/v2rayN.Web/publish/$RID/bin"

      - name: Package the full install and app-only artifacts
        env:
          PUBLISH_DIR: v2rayN/v2rayN.Web/publish/${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash v2rayN/v2rayN.Web/Scripts/package-native.sh "$RID" "$PUBLISH_DIR" dist
          "$PUBLISH_DIR/bin/xray/xray" -version
          "$PUBLISH_DIR/bin/sing_box/sing-box" version
          "$PUBLISH_DIR/bin/mihomo/mihomo" -v

      - name: Upload native artifacts
        uses: actions/upload-artifact@v7
        with:
          name: v2rayN.Web-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: error

  container:
    name: Verify Containerfile (${{ matrix.rid }})
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            platform: linux/amd64
          - rid: linux-arm64
            platform: linux/arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Containerfile (no push)
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./v2rayN/v2rayN.Web/Containerfile
          platforms: ${{ matrix.platform }}
          tags: v2rayn-web:ci
          build-args: |
            RID=${{ matrix.rid }}
            WEB_VERSION=${{ needs.identity.outputs.version }}
            WEB_REPOSITORY=${{ github.repository }}
            WEB_COMMIT=${{ github.sha }}
            WEB_BUILD_DATE=${{ needs.identity.outputs.build_date }}
          push: false

  release-assets:
    name: Assemble and validate Web release assets
    if: needs.identity.outputs.release == 'true'
    needs:
      - identity
      - verify
      - native
      - container
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download verified native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: v2rayN.Web-*
          path: release-assets
          merge-multiple: true

      - name: Build and validate web-update.json
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          python3 v2rayN/v2rayN.Web/Scripts/web-update-manifest.py write \
            --version "$RELEASE_TAG" \
            --repository "${{ github.repository }}" \
            --commit "${{ github.sha }}" \
            --build-date "${{ needs.identity.outputs.build_date }}" \
            --dist release-assets \
            --output release-assets/web-update.json
          python3 v2rayN/v2rayN.Web/Scripts/web-update-manifest.py verify \
            --manifest release-assets/web-update.json \
            --dist release-assets \
            --repository "${{ github.repository }}"
          ls -l release-assets

      - name: Upload Web release packages
        uses: actions/upload-artifact@v7
        with:
          name: web-release-packages
          path: release-assets/*.tar.gz
          if-no-files-found: error

      - name: Upload Web update manifest
        uses: actions/upload-artifact@v7
        with:
          name: web-release-manifest
          path: release-assets/web-update.json
          if-no-files-found: error
