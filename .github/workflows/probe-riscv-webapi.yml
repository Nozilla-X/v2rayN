name: probe riscv64 WebAPI publish

# Temporary fork-only probe: verify whether the community linux-riscv64 .NET SDK can
# publish v2rayN.WebAPI single-file and run it natively on the RISE runner.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: riscv64 single-file publish probe
    runs-on: ubuntu-24.04-riscv
    container: debian:13
    steps:
      - name: Prepare tools (Debian)
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y sudo git rsync findutils tar gzip unzip which curl jq wget file ca-certificates libc6-dev libgcc-s1 libstdc++6 zlib1g libatomic1 libicu76 || \
            apt-get install -y sudo git rsync findutils tar gzip unzip which curl jq wget file ca-certificates libc6-dev libgcc-s1 libstdc++6 zlib1g libatomic1 libicu72
      - name: Checkout web-api
        shell: bash
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          rm -rf ./*
          git init .
          git config --global --add safe.directory "$PWD"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin web-api
          git checkout FETCH_HEAD
      - name: Install community .NET SDK (linux-riscv64)
        shell: bash
        run: |
          set -euo pipefail
          SDK=dotnet-sdk-10.0.111-linux-riscv64.tar.gz
          curl -fL "https://github.com/xujiegb/dotnet-riscv/releases/download/10.0.111/$SDK" -o /tmp/$SDK
          mkdir -p "$HOME/.dotnet"
          tar -C "$HOME/.dotnet" -xzf /tmp/$SDK
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          dotnet --info
      - name: Publish WebAPI single-file (linux-riscv64)
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_ROOT="$HOME/.dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          dotnet publish v2rayN/v2rayN.WebAPI/v2rayN.WebAPI.csproj -c Release -r linux-riscv64 \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:WebVersion=0.0.0-probe -p:WebCommit=probe -p:WebBuildDate=probe \
            -p:WebRepository="$GITHUB_REPOSITORY" \
            -o /tmp/publish-riscv64
          echo '--- publish output ---'
          ls -la /tmp/publish-riscv64
          file /tmp/publish-riscv64/v2rayN.WebAPI || true
      - name: Smoke run on native riscv64
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/publish-riscv64
          echo '--- --help ---'
          ./v2rayN.WebAPI --help | head -n 6
          export V2RAYN_WEB_API_KEY=probe-key-0123456789abcdef
          export ASPNETCORE_URLS=http://127.0.0.1:5080
          ./v2rayN.WebAPI --foreground --no-open > probe.log 2>&1 &
          APP=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5080/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo '--- probe.log ---'
            tail -n 60 probe.log
            kill -9 $APP 2>/dev/null || true
            exit 1
          fi
          echo '--- health ---'
          curl -fsS http://127.0.0.1:5080/api/health; echo
          kill -TERM $APP
          wait $APP || true
          echo 'riscv64 probe: single-file publish + native smoke OK'
