name: Release v2rayN Web

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:
    inputs:
      web_version:
        description: 'Web version (for example 7.25.2-web.1)'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease channel entry'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Web and ServiceLib
    runs-on: ubuntu-24.04
    env:
      TUNIT_MAX_PARALLEL_TESTS: 1
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify frontend, tests, and native publish
        run: bash v2rayN/v2rayN.Web/Scripts/verify.sh "$RUNNER_TEMP/v2rayN.Web-release-verify"

  native:
    name: Native release packages (${{ matrix.rid }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Resolve Web version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.web_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#web-v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-web\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Web application
        env:
          RID: ${{ matrix.rid }}
          V2RAYN_WEB_VERSION: ${{ steps.version.outputs.version }}
          V2RAYN_WEB_COMMIT: ${{ github.sha }}
          V2RAYN_WEB_BUILD_DATE: ${{ github.run_started_at }}
        run: bash v2rayN/v2rayN.Web/Scripts/publish-native.sh "$RID"
      - name: Integrate Core bundle for fresh-install package
        env:
          RID: ${{ matrix.rid }}
        run: sh v2rayN/v2rayN.Web/Scripts/fetch-core-bundle.sh "$RID" "v2rayN/v2rayN.Web/publish/$RID/bin"
      - name: Package full install and app-only self-update artifacts
        env:
          RID: ${{ matrix.rid }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="v2rayN/v2rayN.Web/publish/$RID"
          test -x "$publish_dir/v2rayN.Web"
          test -f "$publish_dir/wwwroot/index.html"
          test -x "$publish_dir/bin/xray/xray"
          test -x "$publish_dir/bin/sing_box/sing-box"
          test -x "$publish_dir/bin/mihomo/mihomo"
          test -s "$publish_dir/bin/geosite.dat"
          test -s "$publish_dir/bin/geoip.dat"
          mkdir -p dist app-only/wwwroot
          tar -C "$publish_dir" -czf "dist/v2rayN.Web-$RID.tar.gz" .
          tar -tzf "dist/v2rayN.Web-$RID.tar.gz" > "$RUNNER_TEMP/full-$RID.contents"
          grep -Fxq './v2rayN.Web' "$RUNNER_TEMP/full-$RID.contents"
          grep -Fxq './wwwroot/index.html' "$RUNNER_TEMP/full-$RID.contents"
          grep -Fxq './bin/xray/xray' "$RUNNER_TEMP/full-$RID.contents"
          grep -Fxq './bin/sing_box/sing-box' "$RUNNER_TEMP/full-$RID.contents"
          grep -Fxq './bin/mihomo/mihomo' "$RUNNER_TEMP/full-$RID.contents"
          install -m 755 "$publish_dir/v2rayN.Web" app-only/v2rayN.Web
          install -m 644 "$publish_dir/v2rayN.Web.build.json" app-only/v2rayN.Web.build.json
          cp -a "$publish_dir/wwwroot/." app-only/wwwroot/
          tar -C app-only -czf "dist/v2rayN.Web-app-$RID.tar.gz" v2rayN.Web v2rayN.Web.build.json wwwroot
          tar -tzf "dist/v2rayN.Web-app-$RID.tar.gz" > "$RUNNER_TEMP/app-only-$RID.contents"
          grep -Fxq 'v2rayN.Web' "$RUNNER_TEMP/app-only-$RID.contents"
          grep -Fxq 'wwwroot/index.html' "$RUNNER_TEMP/app-only-$RID.contents"
          ! grep -Eq '(^|/)bin/|guiConfigs|guiLogs|webData|web-auth\.json' "$RUNNER_TEMP/app-only-$RID.contents"
      - name: Upload native assets for gated release
        uses: actions/upload-artifact@v7
        with:
          name: web-release-${{ matrix.rid }}
          path: dist/v2rayN.Web*-${{ matrix.rid }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  container:
    name: Verify Containerfile (${{ matrix.rid }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            platform: linux/amd64
          - rid: linux-arm64
            platform: linux/arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve Web version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.web_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#web-v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-web\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build Containerfile without publishing
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: ./v2rayN/v2rayN.Web/Containerfile
          platforms: ${{ matrix.platform }}
          tags: v2rayn-web:release-verify
          build-args: |
            RID=${{ matrix.rid }}
            WEB_VERSION=${{ steps.version.outputs.version }}
            WEB_COMMIT=${{ github.sha }}
            WEB_BUILD_DATE=${{ github.run_started_at }}
          push: false

  release:
    name: Publish gated GitHub Release
    needs:
      - verify
      - native
      - container
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified native artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: web-release-*
          path: release-assets
          merge-multiple: true
      - name: Build Web update manifest and release tag
        id: manifest
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.web_version }}
          BUILD_DATE: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#web-v}"
          else
            version="$INPUT_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-web\.[0-9]+$ ]]
          tag="web-v$version"
          commit="$(git rev-parse HEAD)"
          build_date="$BUILD_DATE"
          python3 - "$version" "$commit" "$build_date" "$tag" release-assets/web-update.json <<'PY'
          import hashlib, json, pathlib, sys
          version, commit, build_date, tag, manifest_path = sys.argv[1:]
          packages = []
          for rid in ("linux-x64", "linux-arm64"):
              asset = f"v2rayN.Web-app-{rid}.tar.gz"
              path = pathlib.Path("release-assets") / asset
              data = path.read_bytes()
              packages.append({
                  "rid": rid,
                  "asset": asset,
                  "url": f"https://github.com/Nozilla-X/v2rayN/releases/download/{tag}/{asset}",
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "size": len(data),
              })
          manifest = {
              "product": "v2rayN.Web",
              "version": version,
              "commit": commit,
              "buildDate": build_date,
              "packages": packages,
          }
          pathlib.Path(manifest_path).write_text(json.dumps(manifest, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            prerelease="${{ inputs.prerelease }}"
          else
            prerelease="false"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Publish release and both artifact types
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: v2rayN Web ${{ steps.manifest.outputs.version }}
          prerelease: ${{ steps.manifest.outputs.prerelease == 'true' }}
          files: |
            release-assets/v2rayN.Web-linux-x64.tar.gz
            release-assets/v2rayN.Web-linux-arm64.tar.gz
            release-assets/v2rayN.Web-app-linux-x64.tar.gz
            release-assets/v2rayN.Web-app-linux-arm64.tar.gz
            release-assets/web-update.json
          fail_on_unmatched_files: true
